[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagrams-from-json"
version = "0.1.0"
description = "Turn a YAML or JSON spec into a clean SVG architecture diagram"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Stefan Yasin" }]
keywords = ["diagrams", "svg", "architecture", "yaml", "json", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9,<1.0"]

[project.scripts]
diagrams-from-json = "diagrams_from_json.cli:main"

[project.urls]
Homepage = "https://github.com/StefanYasin/diagrams-from-json"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
